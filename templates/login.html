<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login • JeevanDost</title>
<style>
  /* Theme matches index: teal/blue gradient, rounded cards, shadows */
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, sans-serif;
    background-image: url('https://static.vecteezy.com/system/resources/previews/006/712/985/non_2x/abstract-health-medical-science-healthcare-icon-digital-technology-science-concept-modern-innovation-treatment-medicine-on-hi-tech-future-blue-background-for-wallpaper-template-web-design-vector.jpg'); /* fallback: index file contains same background */
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  .card{
    width:420px;
    background:rgba(255,255,255,0.96);
    border-radius:16px;
    padding:28px;
    box-shadow:0 12px 32px rgba(0,0,0,0.25);
  }
  h2{ color:#00796b; margin:0 0 14px; font-size:24px; text-align:center}
  .input{ width:100%; padding:12px; border-radius:10px; border:2px solid #00bcd4; margin-bottom:12px; outline:none; font-size:14px}
  .btn{ width:100%; background:linear-gradient(135deg,#00bcd4,#00796b); color:#fff; padding:12px; border-radius:12px; border:none; font-weight:700; cursor:pointer}
  .small{ font-size:13px; color:#555; text-align:center; margin-top:12px}
  .link{ color:#00796b; font-weight:700; text-decoration:none }
  .error{ background:#ffebee; border-left:4px solid #f44336; padding:8px 10px; border-radius:8px; color:#7a1f1f; margin-bottom:12px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Welcome back to JeevanDost</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input class="input" name="username" placeholder="Username" required />
      <input class="input" type="password" name="password" placeholder="Password" required />
      <button class="btn" type="submit">Login</button>
    </form>
    <div class="small">Don't have an account? <a class="link" href="/signup">Sign up</a></div>
  </div>
</body>
</html>
