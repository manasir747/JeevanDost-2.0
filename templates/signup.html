<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign Up • JeevanDost</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, sans-serif;
    background-image: url('https://static.vecteezy.com/system/resources/previews/006/712/985/non_2x/abstract-health-medical-science-healthcare-icon-digital-technology-science-concept-modern-innovation-treatment-medicine-on-hi-tech-future-blue-background-for-wallpaper-template-web-design-vector.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  .card{ width:520px; background:rgba(255,255,255,0.96); border-radius:16px; padding:26px; box-shadow:0 12px 32px rgba(0,0,0,0.25); }
  h2{ color:#00796b; margin:0 0 12px; text-align:center }
  .row{ display:flex; gap:10px; }
  .input{ width:100%; padding:10px; border-radius:10px; border:2px solid #00bcd4; margin-bottom:10px; font-size:14px }
  .btn{ width:100%; background:linear-gradient(135deg,#00bcd4,#00796b); color:#fff; padding:12px; border-radius:12px; border:none; font-weight:700; cursor:pointer }
  .small{ text-align:center; color:#555; font-size:13px; margin-top:10px }
  .error{ background:#ffebee; border-left:4px solid #f44336; padding:8px 10px; border-radius:8px; color:#7a1f1f; margin-bottom:12px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Create your account</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/signup">
      <input class="input" name="full_name" placeholder="Full name" required />
      <div class="row">
        <input class="input" name="dob" type="date" placeholder="DOB" required />
        <input class="input" name="age" type="number" placeholder="Age" required />
      </div>
      <input class="input" name="phone" placeholder="Mobile number" required />
      <input class="input" name="email" type="email" placeholder="Email" required />
      <input class="input" name="username" placeholder="Choose username" required />
      <input class="input" name="password" type="password" placeholder="Choose password" required />
      <button class="btn" type="submit">Create Account</button>
    </form>
    <div class="small">Already have an account? <a href="/login" class="link">Login</a></div>
  </div>
</body>
</html>
